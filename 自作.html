<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>セルフステータス管理 - 完全版</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .exp-bar {
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .level-glow {
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
    }
    .status-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .floating-animation {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .number-input {
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }
    .number-input::-webkit-outer-spin-button,
    .number-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <!-- ヘッダー -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">
        セルフステータス管理
      </h1>
      <p class="text-gray-600">毎日の成長を可視化して、レベルアップしよう！</p>
    </div>

    <!-- タブ切替 -->
    <div class="flex justify-center mb-6">
      <button id="tabMain" class="px-6 py-3 rounded-l-xl bg-indigo-600 text-white font-semibold shadow-lg transition-all hover:bg-indigo-700">
        ダッシュボード
      </button>
      <button id="tabManage" class="px-6 py-3 rounded-r-xl bg-gray-200 text-gray-700 font-semibold shadow-lg transition-all hover:bg-gray-300">
        管理画面
      </button>
    </div>

    <!-- === ダッシュボード画面 === -->
    <div id="mainView">
      <!-- レベル & 経験値表示 -->
      <div class="bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 text-white rounded-3xl shadow-2xl p-6 mb-8 floating-animation">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-xl font-bold mb-2">あなたのレベル</h2>
            <span id="levelValue" class="text-5xl font-extrabold level-glow">1</span>
            <span class="text-lg ml-2 opacity-80">Lv</span>
          </div>
          <div class="text-right">
            <div class="text-sm opacity-80">総合スコア</div>
            <div id="totalScore" class="text-2xl font-bold">0</div>
          </div>
        </div>
        
        <!-- 経験値バー -->
        <div class="mb-3">
          <div class="flex justify-between text-sm opacity-90 mb-1">
            <span>経験値</span>
            <span id="expText">0 / 100</span>
          </div>
          <div class="w-full bg-white/30 rounded-full h-4 overflow-hidden">
            <div id="expBar" class="exp-bar h-4 rounded-full transition-all duration-1000 ease-out" style="width:0%"></div>
          </div>
        </div>
        
        <div id="nextLevelInfo" class="text-sm opacity-90 text-center">
          次のレベルまであと少し！
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        <!-- 入力フォーム -->
        <div class="bg-white shadow-xl rounded-3xl p-6">
          <h2 class="text-2xl font-semibold mb-6 text-gray-800 flex items-center">
            <span class="mr-3">📊</span>今日のデータ入力
          </h2>
          <form id="statusForm" class="space-y-4">
            <div class="grid grid-cols-1 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">💪 筋力 (ベンチプレス重量 kg)</label>
                <input type="number" id="training" class="number-input w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" 
                       step="0.5" min="0" placeholder="例: 60.5"/>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">🧠 知力 (学習時間 h)</label>
                <input type="number" id="study" class="number-input w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" 
                       step="0.25" min="0" placeholder="例: 2.5"/>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">😴 睡眠力 (睡眠時間 h)</label>
                <input type="number" id="sleep" class="number-input w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" 
                       step="0.25" min="0" max="24" placeholder="例: 7.5"/>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">🔥 継続力 (連続継続日数)</label>
                <input type="number" id="continuity" class="number-input w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" 
                       step="1" min="0" placeholder="例: 15"/>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">⚡ 生産性 (集中作業時間 h)</label>
                <input type="number" id="productivity" class="number-input w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" 
                       step="0.25" min="0" placeholder="例: 4.5"/>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">🧘 精神力 (瞑想・リラックス時間 min)</label>
                <input type="number" id="mental" class="number-input w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" 
                       step="5" min="0" placeholder="例: 30"/>
              </div>
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-semibold text-lg shadow-lg hover:from-indigo-700 hover:to-purple-700 transition-all transform hover:scale-105">
              データを保存してレベルアップ！
            </button>
          </form>
        </div>

        <!-- レーダーチャート -->
        <div class="bg-white shadow-xl rounded-3xl p-6">
          <h2 class="text-2xl font-semibold mb-4 text-gray-800 flex items-center">
            <span class="mr-3">🎯</span>現在のステータス
          </h2>
          <div class="relative">
            <canvas id="radarChart" class="max-h-80"></canvas>
          </div>
          <div class="mt-6 text-center">
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-gradient-to-r from-green-400 to-green-600 text-white p-3 rounded-xl">
                <div class="text-sm opacity-80">平均スコア</div>
                <div id="avgScore" class="text-2xl font-bold">--</div>
              </div>
              <div class="bg-gradient-to-r from-blue-400 to-blue-600 text-white p-3 rounded-xl">
                <div class="text-sm opacity-80">最高スコア</div>
                <div id="maxScore" class="text-2xl font-bold">--</div>
              </div>
            </div>
            <div id="lastDate" class="text-sm text-gray-500 mt-3">--</div>
          </div>
        </div>
      </div>

      <!-- 推移チャート -->
      <div class="bg-white shadow-xl rounded-3xl p-6">
        <h2 class="text-2xl font-semibold mb-6 text-gray-800 flex items-center">
          <span class="mr-3">📈</span>成長の軌跡
        </h2>
        <canvas id="lineChart" class="max-h-96"></canvas>
      </div>
    </div>

    <!-- === 管理画面 === -->
    <div id="manageView" class="hidden">
      <div class="bg-white shadow-xl rounded-3xl p-6">
        <h2 class="text-2xl font-semibold mb-6 text-gray-800 flex items-center">
          <span class="mr-3">📋</span>データ履歴管理
        </h2>
        <div id="historyList" class="space-y-4 max-h-96 overflow-y-auto"></div>
        
        <div class="mt-6 p-4 bg-red-50 rounded-xl">
          <h3 class="text-lg font-semibold text-red-700 mb-2">⚠️ 危険操作</h3>
          <button id="clearAllBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all">
            全データを削除
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Firebase設定（実際の設定に置き換えてください）
    const firebaseConfig = {
      // ここにFirebaseの設定を入力
      // 実際の運用では環境変数などを使用してください
    };

    let db;
    let isFirebaseAvailable = false;

    // Firebase初期化を試行
    try {
      if (typeof firebase !== 'undefined' && firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseAvailable = true;
        console.log('Firebase initialized successfully');
      }
    } catch (error) {
      console.log('Firebase not available, using localStorage');
      isFirebaseAvailable = false;
    }

    // ローカルストレージでのデータ管理
    const localDb = {
      async save(data) {
        const existing = JSON.parse(localStorage.getItem('statusData') || '[]');
        existing.push(data);
        localStorage.setItem('statusData', JSON.stringify(existing));
        return data;
      },
      
      async getAll() {
        return JSON.parse(localStorage.getItem('statusData') || '[]');
      },
      
      async delete(id) {
        const existing = JSON.parse(localStorage.getItem('statusData') || '[]');
        const filtered = existing.filter(item => item.id !== id);
        localStorage.setItem('statusData', JSON.stringify(filtered));
      },
      
      async clear() {
        localStorage.removeItem('statusData');
      }
    };

    // データベース操作の抽象化
    const dataManager = {
      async save(data) {
        if (isFirebaseAvailable) {
          try {
            await db.collection('statusData').add(data);
            return data;
          } catch (error) {
            console.error('Firebase save failed, using localStorage', error);
            return localDb.save(data);
          }
        } else {
          return localDb.save(data);
        }
      },
      
      async getAll() {
        if (isFirebaseAvailable) {
          try {
            const snapshot = await db.collection('statusData').orderBy('timestamp', 'desc').limit(50).get();
            return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          } catch (error) {
            console.error('Firebase fetch failed, using localStorage', error);
            return localDb.getAll();
          }
        } else {
          return localDb.getAll();
        }
      },
      
      async delete(id) {
        if (isFirebaseAvailable) {
          try {
            await db.collection('statusData').doc(id).delete();
          } catch (error) {
            console.error('Firebase delete failed, using localStorage', error);
            localDb.delete(id);
          }
        } else {
          localDb.delete(id);
        }
      },
      
      async clear() {
        if (isFirebaseAvailable) {
          try {
            const snapshot = await db.collection('statusData').get();
            const batch = db.batch();
            snapshot.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          } catch (error) {
            console.error('Firebase clear failed, using localStorage', error);
            localDb.clear();
          }
        } else {
          localDb.clear();
        }
      }
    };

    // DOM要素取得
    const elements = {
      radarCtx: document.getElementById('radarChart').getContext('2d'),
      lineCtx: document.getElementById('lineChart').getContext('2d'),
      avgScore: document.getElementById('avgScore'),
      maxScore: document.getElementById('maxScore'),
      lastDate: document.getElementById('lastDate'),
      levelValue: document.getElementById('levelValue'),
      totalScore: document.getElementById('totalScore'),
      expBar: document.getElementById('expBar'),
      expText: document.getElementById('expText'),
      nextLevelInfo: document.getElementById('nextLevelInfo'),
      historyList: document.getElementById('historyList')
    };

    // === RPG風レベル計算 ===
    function calculateLevel(totalExp) {
      // 経験値からレベルを計算（曲線的に増加）
      const level = Math.floor(Math.pow(totalExp / 50, 0.7)) + 1;
      return Math.min(level, 100);
    }

    function getExpForLevel(level) {
      // そのレベルに必要な経験値
      return Math.floor(Math.pow(level - 1, 1 / 0.7) * 50);
    }

    function getExpForNextLevel(level) {
      // 次のレベルに必要な経験値
      return getExpForLevel(level + 1);
    }

    function updateLevelDisplay(totalExp) {
      const currentLevel = calculateLevel(totalExp);
      const currentLevelExp = getExpForLevel(currentLevel);
      const nextLevelExp = getExpForNextLevel(currentLevel);
      
      const expInCurrentLevel = totalExp - currentLevelExp;
      const expNeededForNext = nextLevelExp - currentLevelExp;
      const expProgress = Math.min(100, (expInCurrentLevel / expNeededForNext) * 100);
      
      elements.levelValue.textContent = currentLevel;
      elements.totalScore.textContent = Math.round(totalExp);
      elements.expBar.style.width = `${expProgress}%`;
      elements.expText.textContent = `${Math.round(expInCurrentLevel)} / ${Math.round(expNeededForNext)}`;
      
      if (currentLevel >= 100) {
        elements.nextLevelInfo.textContent = "最大レベル到達！ おめでとうございます！ 🎉";
      } else {
        const expNeeded = Math.ceil(nextLevelExp - totalExp);
        elements.nextLevelInfo.textContent = `次のレベルまで経験値 ${expNeeded} が必要です`;
      }
    }

    // === スコア変換関数 ===
    function convertToScore(rawData) {
      return {
        training: Math.min(100, (rawData.training || 0) * 1.2), // ベンチプレス重量
        study: Math.min(100, (rawData.study || 0) * 10), // 学習時間
        sleep: Math.max(0, 100 - Math.abs((rawData.sleep || 0) - 7.5) * 13.3), // 理想7.5時間
        continuity: Math.min(100, (rawData.continuity || 0) * 2), // 継続日数
        productivity: Math.min(100, (rawData.productivity || 0) * 12.5), // 作業時間
        mental: Math.min(100, (rawData.mental || 0) * 1.67) // 瞑想時間(分)
      };
    }

    // === チャート初期化 ===
    const radarChart = new Chart(elements.radarCtx, {
      type: 'radar',
      data: {
        labels: ['筋力', '知力', '睡眠力', '継続力', '生産性', '精神力'],
        datasets: [{
          label: 'ステータス',
          data: [0, 0, 0, 0, 0, 0],
          backgroundColor: 'rgba(99, 102, 241, 0.2)',
          borderColor: 'rgba(99, 102, 241, 1)',
          borderWidth: 3,
          pointBackgroundColor: 'rgba(139, 92, 246, 1)',
          pointBorderColor: '#fff',
          pointRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 0,
            max: 100,
            ticks: {
              stepSize: 20,
              font: { size: 12 }
            },
            grid: { color: 'rgba(0,0,0,0.1)' }
          }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });

    const lineChart = new Chart(elements.lineCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: '平均スコア',
            data: [],
            borderColor: 'rgba(16, 185, 129, 1)',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            fill: true,
            tension: 0.4,
            borderWidth: 3
          },
          {
            label: 'レベル',
            data: [],
            borderColor: 'rgba(245, 158, 11, 1)',
            backgroundColor: 'rgba(245, 158, 11, 0.1)',
            fill: false,
            tension: 0.4,
            borderWidth: 3,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: { display: true, text: 'スコア' }
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            beginAtZero: true,
            max: 100,
            title: { display: true, text: 'レベル' },
            grid: { drawOnChartArea: false }
          }
        },
        plugins: {
          legend: { display: true, position: 'top' }
        }
      }
    });

    // === タブ切替 ===
    const tabElements = {
      main: document.getElementById('tabMain'),
      manage: document.getElementById('tabManage'),
      mainView: document.getElementById('mainView'),
      manageView: document.getElementById('manageView')
    };

    function switchTab(activeTab) {
      if (activeTab === 'main') {
        tabElements.mainView.classList.remove('hidden');
        tabElements.manageView.classList.add('hidden');
        tabElements.main.classList.add('bg-indigo-600', 'text-white');
        tabElements.main.classList.remove('bg-gray-200', 'text-gray-700');
        tabElements.manage.classList.remove('bg-indigo-600', 'text-white');
        tabElements.manage.classList.add('bg-gray-200', 'text-gray-700');
      } else {
        tabElements.manageView.classList.remove('hidden');
        tabElements.mainView.classList.add('hidden');
        tabElements.manage.classList.add('bg-indigo-600', 'text-white');
        tabElements.manage.classList.remove('bg-gray-200', 'text-gray-700');
        tabElements.main.classList.remove('bg-indigo-600', 'text-white');
        tabElements.main.classList.add('bg-gray-200', 'text-gray-700');
        loadHistory();
      }
    }

    tabElements.main.addEventListener('click', () => switchTab('main'));
    tabElements.manage.addEventListener('click', () => switchTab('manage'));

    // === フォーム送信 ===
    document.getElementById('statusForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        id: Date.now().toString(),
        timestamp: new Date().toISOString(),
        training: parseFloat(document.getElementById('training').value) || 0,
        study: parseFloat(document.getElementById('study').value) || 0,
        sleep: parseFloat(document.getElementById('sleep').value) || 0,
        continuity: parseFloat(document.getElementById('continuity').value) || 0,
        productivity: parseFloat(document.getElementById('productivity').value) || 0,
        mental: parseFloat(document.getElementById('mental').value) || 0
      };

      try {
        await dataManager.save(formData);
        // フォームをリセットしない（入力値を保持）
        await loadData();
        
        // 保存成功のフィードバック
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = '保存完了！ ✅';
        submitBtn.classList.add('bg-green-500');
        setTimeout(() => {
          submitBtn.textContent = originalText;
          submitBtn.classList.remove('bg-green-500');
        }, 2000);
        
      } catch (error) {
        console.error('データ保存エラー:', error);
        alert('データの保存に失敗しました。');
      }
    });

    // === データ読み込み・表示 ===
    async function loadData() {
      try {
        const allData = await dataManager.getAll();
        
        if (allData.length === 0) {
          updateLevelDisplay(0);
          return;
        }

        // 最新データでレーダーチャート更新
        const latestData = allData[0];
        const latestScores = convertToScore(latestData);
        const scoresArray = [
          latestScores.training,
          latestScores.study,
          latestScores.sleep,
          latestScores.continuity,
          latestScores.productivity,
          latestScores.mental
        ];

        radarChart.data.datasets[0].data = scoresArray;
        radarChart.update();

        // 統計情報更新
        const avgScore = Math.round(scoresArray.reduce((a, b) => a + b, 0) / 6);
        const maxScore = Math.max(...scoresArray);
        const totalExp = scoresArray.reduce((a, b) => a + b, 0);
        
        elements.avgScore.textContent = avgScore;
        elements.maxScore.textContent = Math.round(maxScore);
        elements.lastDate.textContent = `最終更新: ${new Date(latestData.timestamp).toLocaleString('ja-JP')}`;
        
        updateLevelDisplay(totalExp);

        // 推移チャート更新
        const sortedData = allData.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        const chartLabels = sortedData.map(d => 
          new Date(d.timestamp).toLocaleDateString('ja-JP', {
            month: 'short',
            day: 'numeric'
          })
        );
        
        const avgScores = sortedData.map(d => {
          const scores = convertToScore(d);
          const scoresArr = [scores.training, scores.study, scores.sleep, scores.continuity, scores.productivity, scores.mental];
          return Math.round(scoresArr.reduce((a, b) => a + b, 0) / 6);
        });
        
        const levels = sortedData.map(d => {
          const scores = convertToScore(d);
          const scoresArr = [scores.training, scores.study, scores.sleep, scores.continuity, scores.productivity, scores.mental];
          const totalExp = scoresArr.reduce((a, b) => a + b, 0);
          return calculateLevel(totalExp);
        });

        lineChart.data.labels = chartLabels;
        lineChart.data.datasets[0].data = avgScores;
        lineChart.data.datasets[1].data = levels;
        lineChart.update();

      } catch (error) {
        console.error('データ読み込みエラー:', error);
      }
    }

    // === 履歴管理 ===
    async function loadHistory() {
      try {
        const allData = await dataManager.getAll();
        elements.historyList.innerHTML = '';

        if (allData.length === 0) {
          elements.historyList.innerHTML = '<p class="text-gray-500 text-center py-8">データがまだありません</p>';
          return;
        }

        allData.forEach(data => {
          const scores = convertToScore(data);
          const avgScore = Math.round((scores.training + scores.study + scores.sleep + scores.continuity + scores.productivity + scores.mental) / 6);
          
          const historyItem = document.createElement('div');
          historyItem.className = 'border-2 border-gray-100 rounded-xl p-4 hover:border-indigo-200 transition-all';
          historyItem.innerHTML = `
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <div class="font-semibold text-lg text-gray-800 mb-2">
                  ${new Date(data.timestamp).toLocaleString('ja-JP')}
                  <span class="ml-2 px-2 py-1 bg-indigo-100 text-indigo-700 text-sm rounded-full">平均 ${avgScore}</span>
                </div>
                <div class="text-sm text-gray-600 grid grid-cols-2 md:grid-cols-3 gap-2">
                  <span>💪 筋力: ${data.training}</span>
                  <span>🧠 知力: ${data.study}h</span>
                  <span>😴 睡眠: ${data.sleep}h</span>
                  <span>🔥 継続: ${data.continuity}日</span>
                  <span>⚡ 生産: ${data.productivity}h</span>
                  <span>🧘 精神: ${data.mental}分</span>
                </div>
              </div>
              <div class="flex gap-2 ml-4">
                <button class="editBtn px-3 py-2 bg-yellow-400 text-white rounded-lg hover:bg-yellow-500 transition-all text-sm">
                  編集
                </button>
                <button class="deleteBtn px-3 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all text-sm">
                  削除
                </button>
              </div>
            </div>
          `;

          // 削除ボタン
          historyItem.querySelector('.deleteBtn').addEventListener('click', async () => {
            if (confirm('このデータを削除しますか？')) {
              await dataManager.delete(data.id);
              await loadHistory();
              await loadData();
            }
          });

          // 編集ボタン
          historyItem.querySelector('.editBtn').addEventListener('click', async () => {
            document.getElementById('training').value = data.training;
            document.getElementById('study').value = data.study;
            document.getElementById('sleep').value = data.sleep;
            document.getElementById('continuity').value = data.continuity;
            document.getElementById('productivity').value = data.productivity;
            document.getElementById('mental').value = data.mental;
            switchTab('main');
          });

          elements.historyList.appendChild(historyItem);
        });

      } catch (error) {
        console.error('履歴読み込みエラー:', error);
      }
    }

    // === 全データ削除 ===
    document.getElementById('clearAllBtn').addEventListener('click', async () => {
      if (confirm('⚠️ 本当に全データを削除しますか？この操作は取り消せません。')) {
        if (confirm('最終確認: 全てのデータが削除されます。よろしいですか？')) {
          try {
            await dataManager.clear();
            await loadHistory();
            await loadData();
            // フォームもクリア
            document.getElementById('statusForm').reset();
            alert('全データを削除しました。');
          } catch (error) {
            console.error('データ削除エラー:', error);
            alert('データの削除に失敗しました。');
          }
        }
      }
    });

    // === 初期化処理 ===
    function initializeApp() {
      // データベース接続状態の表示
      const statusIndicator = document.createElement('div');
      statusIndicator.className = 'fixed top-4 right-4 px-3 py-1 rounded-full text-xs font-semibold z-50';
      
      if (isFirebaseAvailable) {
        statusIndicator.textContent = '🔥 Firebase接続';
        statusIndicator.classList.add('bg-green-100', 'text-green-700');
      } else {
        statusIndicator.textContent = '💾 ローカル保存';
        statusIndicator.classList.add('bg-blue-100', 'text-blue-700');
      }
      
      document.body.appendChild(statusIndicator);
      
      // 3秒後に非表示
      setTimeout(() => {
        statusIndicator.style.opacity = '0';
        statusIndicator.style.transition = 'opacity 0.5s';
        setTimeout(() => statusIndicator.remove(), 500);
      }, 3000);

      // データ読み込み
      loadData();
    }

    // === スマホ対応の入力改善 ===
    document.querySelectorAll('.number-input').forEach(input => {
      // フォーカス時の動作
      input.addEventListener('focus', function() {
        this.classList.add('ring-4', 'ring-indigo-100', 'border-indigo-500');
      });
      
      input.addEventListener('blur', function() {
        this.classList.remove('ring-4', 'ring-indigo-100');
      });
      
      // 入力値の検証と調整
      input.addEventListener('input', function() {
        const min = parseFloat(this.getAttribute('min')) || 0;
        const max = parseFloat(this.getAttribute('max')) || Infinity;
        let value = parseFloat(this.value);
        
        if (isNaN(value)) return;
        
        if (value < min) {
          this.value = min;
        } else if (value > max) {
          this.value = max;
        }
        
        // リアルタイムプレビュー（オプション）
        updatePreview();
      });
    });

    // === リアルタイムプレビュー ===
    function updatePreview() {
      const formData = {
        training: parseFloat(document.getElementById('training').value) || 0,
        study: parseFloat(document.getElementById('study').value) || 0,
        sleep: parseFloat(document.getElementById('sleep').value) || 0,
        continuity: parseFloat(document.getElementById('continuity').value) || 0,
        productivity: parseFloat(document.getElementById('productivity').value) || 0,
        mental: parseFloat(document.getElementById('mental').value) || 0
      };
      
      const scores = convertToScore(formData);
      const scoresArray = [
        scores.training,
        scores.study,
        scores.sleep,
        scores.continuity,
        scores.productivity,
        scores.mental
      ];
      
      // プレビュー用の薄い色でレーダーチャートを更新
      if (radarChart.data.datasets.length === 1) {
        radarChart.data.datasets.push({
          label: 'プレビュー',
          data: [0, 0, 0, 0, 0, 0],
          backgroundColor: 'rgba(234, 179, 8, 0.1)',
          borderColor: 'rgba(234, 179, 8, 0.5)',
          borderWidth: 2,
          pointBackgroundColor: 'rgba(234, 179, 8, 0.8)',
          pointBorderColor: '#fff',
          pointRadius: 4,
          borderDash: [5, 5]
        });
      }
      
      const hasAnyInput = scoresArray.some(score => score > 0);
      if (hasAnyInput) {
        radarChart.data.datasets[1].data = scoresArray;
      } else {
        radarChart.data.datasets[1].data = [0, 0, 0, 0, 0, 0];
      }
      
      radarChart.update('none'); // アニメーションなしで更新
    }

    // === キーボードショートカット ===
    document.addEventListener('keydown', function(e) {
      // Ctrl+S で保存
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        document.getElementById('statusForm').dispatchEvent(new Event('submit'));
      }
      
      // Ctrl+1 でダッシュボード, Ctrl+2 で管理画面
      if (e.ctrlKey && e.key === '1') {
        e.preventDefault();
        switchTab('main');
      }
      if (e.ctrlKey && e.key === '2') {
        e.preventDefault();
        switchTab('manage');
      }
    });

    // === PWA対応のマニフェスト情報 ===
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // Service Workerは実装していませんが、将来の拡張のための準備
          console.log('PWA ready for service worker registration');
        } catch (error) {
          console.log('Service Worker registration failed');
        }
      });
    }

    // === データエクスポート機能 ===
    function exportData() {
      dataManager.getAll().then(data => {
        const exportData = {
          exportDate: new Date().toISOString(),
          version: '2.0',
          data: data
        };
        
        const blob = new Blob([JSON.stringify(exportData, null, 2)], {
          type: 'application/json'
        });
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `status-data-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    // === データインポート機能 ===
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          
          if (importedData.data && Array.isArray(importedData.data)) {
            if (confirm(`${importedData.data.length}件のデータをインポートしますか？`)) {
              for (const item of importedData.data) {
                await dataManager.save(item);
              }
              await loadData();
              await loadHistory();
              alert('データのインポートが完了しました！');
            }
          } else {
            alert('無効なデータファイルです。');
          }
        } catch (error) {
          console.error('Import error:', error);
          alert('データの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }

    // === エクスポート・インポートボタンの追加 ===
    const exportBtn = document.createElement('button');
    exportBtn.textContent = '📤 データエクスポート';
    exportBtn.className = 'bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-all mr-2';
    exportBtn.addEventListener('click', exportData);

    const importInput = document.createElement('input');
    importInput.type = 'file';
    importInput.accept = '.json';
    importInput.style.display = 'none';
    importInput.addEventListener('change', importData);

    const importBtn = document.createElement('button');
    importBtn.textContent = '📥 データインポート';
    importBtn.className = 'bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-all';
    importBtn.addEventListener('click', () => importInput.click());

    // 管理画面にボタンを追加
    const manageButtonContainer = document.createElement('div');
    manageButtonContainer.className = 'mb-6 flex flex-wrap gap-2';
    manageButtonContainer.appendChild(exportBtn);
    manageButtonContainer.appendChild(importInput);
    manageButtonContainer.appendChild(importBtn);

    document.getElementById('manageView').querySelector('.bg-white').insertBefore(
      manageButtonContainer,
      document.querySelector('.mt-6.p-4.bg-red-50')
    );

    // === 統計情報の拡張 ===
    async function calculateExtendedStats() {
      const allData = await dataManager.getAll();
      if (allData.length === 0) return null;

      const scores = allData.map(d => convertToScore(d));
      const avgScores = scores.map(s => 
        (s.training + s.study + s.sleep + s.continuity + s.productivity + s.mental) / 6
      );

      return {
        totalEntries: allData.length,
        averageScore: avgScores.reduce((a, b) => a + b, 0) / avgScores.length,
        highestScore: Math.max(...avgScores),
        lowestScore: Math.min(...avgScores),
        improvementRate: avgScores.length > 1 ? 
          ((avgScores[avgScores.length - 1] - avgScores[0]) / avgScores[0]) * 100 : 0
      };
    }

    // === レスポンシブ対応の改善 ===
    function adjustForMobile() {
      const isMobile = window.innerWidth < 768;
      
      if (isMobile) {
        // モバイル向けの調整
        radarChart.options.plugins.legend = { display: false };
        lineChart.options.plugins.legend = { position: 'bottom' };
      } else {
        // デスクトップ向けの調整
        radarChart.options.plugins.legend = { display: true };
        lineChart.options.plugins.legend = { position: 'top' };
      }
      
      radarChart.update();
      lineChart.update();
    }

    window.addEventListener('resize', adjustForMobile);

    // === アプリケーション初期化 ===
    document.addEventListener('DOMContentLoaded', () => {
      initializeApp();
      adjustForMobile();
      
      // ウェルカムメッセージ（初回のみ）
      if (localStorage.getItem('welcomed') !== 'true') {
        setTimeout(() => {
          alert('🎉 セルフステータス管理アプリへようこそ！\n\n毎日の活動を記録して、RPG風にレベルアップしていきましょう！');
          localStorage.setItem('welcomed', 'true');
        }, 1000);
      }
    });

  </script>
</body>
</html>
