<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>セルフステータス管理 - 完全版</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
</head>
<body>
  <h1>セルフステータス管理</h1>
  <form id="statusForm">
    筋トレ時間(分): <input type="number" id="training" /><br>
    勉強時間(分): <input type="number" id="study" /><br>
    資産形成(万円): <input type="number" id="asset" /><br>
    継続日数(日): <input type="number" id="continuity" /><br>
    スクリーンタイム(分): <input type="number" id="productivity" /><br>
    メンタル(1-100): <input type="number" id="mental" /><br>
    <button type="submit">保存</button>
  </form>

  <h2>レベル: <span id="level">1</span></h2>
  <canvas id="radarChart"></canvas>
  <canvas id="barChart"></canvas>

  <h2>履歴</h2>
  <ul id="history"></ul>

  <script>
    const db = new PouchDB('statusdb');
    let radarChart, barChart;

    function convertTraining(v){return Math.min(100, Math.round(v/120*100));}
    function convertStudy(v){return Math.min(100, Math.round(v/300*100));}
    function convertAsset(v){return Math.min(100, Math.round(v/100*100));}
    function convertContinuity(v){return Math.min(100, Math.round(v/365*100));}
    function convertProductivity(v){
      let score = 100 - Math.round(v/600*100);
      return Math.max(0, Math.min(100, score));
    }

    document.getElementById('statusForm').addEventListener('submit',async(e)=>{
      e.preventDefault();
      let training = convertTraining(+document.getElementById('training').value||0);
      let studyInput = +document.getElementById('study').value||0;
      let assetInput = +document.getElementById('asset').value||0;
      let continuity = convertContinuity(+document.getElementById('continuity').value||0);
      let productivityInput = +document.getElementById('productivity').value||0;
      let mental = +document.getElementById('mental').value||0;

      let study = convertStudy(studyInput);
      let asset = convertAsset(assetInput);
      let productivity = convertProductivity(productivityInput);

      // 合計は生産性を除外（最大500点）
      let total = training + study + asset + continuity + mental;

      let doc = {
        _id:new Date().toISOString(),
        training, study, asset, continuity, productivity, mental,
        trainingInput:+document.getElementById('training').value||0,
        studyInput, assetInput, continuityInput:+document.getElementById('continuity').value||0,
        productivityInput, mentalInput:mental,
        total
      };
      await db.put(doc);
      updateCharts(doc);
      updateLevel(total);
      refreshHistory();

      localStorage.setItem('lastInputs', JSON.stringify({
        training:document.getElementById('training').value,
        studyInput, assetInput,
        continuity:document.getElementById('continuity').value,
        productivityInput,
        mental
      }));
    });

    function updateCharts(doc){
      let ctxRadar=document.getElementById('radarChart').getContext('2d');
      if(radarChart){radarChart.destroy();}
      radarChart=new Chart(ctxRadar,{
        type:'radar',
        data:{
          labels:['筋力','知力','資産力','継続力','生産性','精神力'],
          datasets:[{
            label:'ステータス',
            data:[doc.training,doc.study,doc.asset,doc.continuity,doc.productivity,doc.mental],
            fill:true,
            backgroundColor:'rgba(54,162,235,0.2)',
            borderColor:'rgb(54,162,235)'
          }]
        },
        options:{scales:{r:{min:0,max:100}}}
      });

      let ctxBar=document.getElementById('barChart').getContext('2d');
      if(barChart){barChart.destroy();}
      barChart=new Chart(ctxBar,{
        type:'bar',
        data:{
          labels:['筋力','知力','資産力','継続力','生産性','精神力'],
          datasets:[{
            label:'ステータス',
            data:[doc.training,doc.study,doc.asset,doc.continuity,doc.productivity,doc.mental],
            backgroundColor:'rgba(255,99,132,0.5)'
          }]
        },
        options:{scales:{y:{min:0,max:100}}}
      });
    }

    function updateLevel(total){
      // レベルは最大100まで。逓減成長（上がりにくくする）
      let level = Math.floor(Math.sqrt(total) * 4.47);
      if (level > 100) level = 100;
      if (level < 1) level = 1;
      document.getElementById('level').textContent = level;
    }

    async function refreshHistory(){
      let ul=document.getElementById('history');
      ul.innerHTML='';
      let res=await db.allDocs({include_docs:true,descending:true});
      res.rows.forEach(r=>{
        let d=r.doc;
        let li=document.createElement('li');
        li.textContent=`${d._id} 総合:${d.total} 筋力:${d.training}(${d.trainingInput}分) 知力:${d.study}(${d.studyInput}分) 資産力:${d.asset}(${d.assetInput}万円) 継続力:${d.continuity}(${d.continuityInput}日) 生産性:${d.productivity}(${d.productivityInput}分) 精神力:${d.mental}`;
        ul.appendChild(li);
      });
    }

    window.addEventListener('load',()=>{
      refreshHistory();
      db.allDocs({include_docs:true}).then(res=>{
        if(res.rows.length>0){
          let latest=res.rows[res.rows.length-1].doc;
          updateCharts(latest);
          updateLevel(latest.total);
        }
      });
      const saved = localStorage.getItem('lastInputs');
      if(saved){
        const d = JSON.parse(saved);
        document.getElementById('training').value = d.training;
        document.getElementById('study').value = d.studyInput;
        document.getElementById('asset').value = d.assetInput;
        document.getElementById('continuity').value = d.continuity;
        document.getElementById('productivity').value = d.productivityInput;
        document.getElementById('mental').value = d.mental;
      }
    });
  </script>
</body>
</html>
