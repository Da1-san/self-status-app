<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>セルフステータス管理 RPG版</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 30% 30%, #0d0d0d 0%, #1a1a2e 100%);
      font-family: 'Inter', sans-serif;
    }
    .glassmorphism {
      background: rgba(15,15,30,0.6);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(102,126,234,0.4);
    }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);}
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);}
    .stat-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg,#fbbf24,#f59e0b);
      border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
      color:white; font-size:14px; font-weight:700; margin-right:8px;
      box-shadow:0 0 10px rgba(251,191,36,0.8);
    }
    .floating-input {
      background: rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.1);
      border-radius:12px; padding:12px; color:#fff; font-weight:bold;
      transition: all 0.3s ease;
    }
    .floating-input:focus {
      border-color:#fbbf24; box-shadow:0 0 20px rgba(251,191,36,0.5); transform: scale(1.05);
      outline:none;
    }
    .neo-button {
      background: linear-gradient(135deg,#f59e0b,#fbbf24);
      box-shadow:0 0 20px rgba(251,191,36,0.4); transition: all 0.3s ease;
      font-family: 'Press Start 2P', cursive;
    }
    .neo-button:hover {
      transform: translateY(-3px);
      box-shadow:0 0 30px rgba(251,191,36,0.7),0 0 50px rgba(251,191,36,0.4);
    }
    .tab-active {
      background: linear-gradient(135deg,#f59e0b,#fbbf24);
      color:#000; font-weight:bold; box-shadow:0 0 20px rgba(251,191,36,0.6);
    }
    .tab-inactive {
      background: rgba(15,15,30,0.5); color:#aaa; border:1px solid rgba(255,255,255,0.1);
    }
    .level-glow {
      background: radial-gradient(circle at top left, rgba(255,215,0,0.2), rgba(0,0,0,0.6));
      border:2px solid rgba(255,215,0,0.5);
      box-shadow:0 0 40px rgba(255,215,0,0.5);
      border-radius:20px;
    }
    #levelValue {
      font-family:'Press Start 2P',cursive; font-size:5rem;
      color:#fbbf24; text-shadow:0 0 20px #fbbf24,0 0 40px #f59e0b;
    }
    #levelBar {
      background: linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);
      box-shadow:0 0 20px rgba(251,191,36,0.6);
      height:12px; border-radius:12px; position:relative; overflow:hidden;
      transition: width 1s ease-out;
    }
    canvas {
      background: rgba(0,0,0,0.5);
      border-radius:20px;
      padding:10px;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="relative z-10 max-w-6xl mx-auto p-4 md:p-8">
    <!-- Header -->
    <div class="text-center mb-12">
      <h1 class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-4">
        RPG STATUS DASHBOARD
      </h1>
      <p class="text-gray-300 text-lg font-light">セルフステータス管理システム</p>
    </div>

    <!-- Tab Navigation -->
    <div class="flex justify-center mb-8">
      <div class="glassmorphism rounded-2xl p-2 flex gap-2">
        <button id="tabMain" class="tab-active px-8 py-3 rounded-xl text-white font-semibold transition-all duration-300">
          📊 ステータス
        </button>
        <button id="tabManage" class="tab-inactive px-8 py-3 rounded-xl text-gray-300 font-semibold transition-all duration-300">
          ⚙️ 管理画面
        </button>
      </div>
    </div>

    <!-- Main & Manage Views -->
    <div id="mainView">
      <!-- データ入力 -->
      <div class="glassmorphism rounded-3xl p-8 mb-8 card-hover">
        <h2 class="text-2xl font-bold text-white mb-6 flex items-center"><div class="stat-icon">📝</div>データ入力</h2>
        <form id="statusForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- ステータス項目はそのまま -->
          <div class="space-y-2"><label class="block text-sm font-semibold text-gray-300 flex items-center"><div class="stat-icon">💪</div>筋力</label><input type="number" id="training" class="floating-input w-full" placeholder="0"></div>
          <div class="space-y-2"><label class="block text-sm font-semibold text-gray-300 flex items-center"><div class="stat-icon">🧠</div>知力</label><input type="number" id="study" class="floating-input w-full" placeholder="0"></div>
          <div class="space-y-2"><label class="block text-sm font-semibold text-gray-300 flex items-center"><div class="stat-icon">💰</div>資産力</label><input type="number" id="asset" class="floating-input w-full" placeholder="0"></div>
          <div class="space-y-2"><label class="block text-sm font-semibold text-gray-300 flex items-center"><div class="stat-icon">⚡</div>継続力</label><input type="number" id="continuity" class="floating-input w-full" placeholder="0"></div>
          <div class="space-y-2"><label class="block text-sm font-semibold text-gray-300 flex items-center"><div class="stat-icon">🚀</div>生産性</label><input type="number" id="productivity" class="floating-input w-full" placeholder="0"></div>
          <div class="space-y-2"><label class="block text-sm font-semibold text-gray-300 flex items-center"><div class="stat-icon">🎯</div>精神力</label><input type="number" id="mental" class="floating-input w-full" placeholder="0"></div>
          <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center mt-4">
            <button type="submit" class="neo-button px-12 py-4 rounded-2xl text-white font-bold text-lg">
              💾 保存する
            </button>
          </div>
        </form>
      </div>

      <!-- レベル表示 -->
      <div class="level-glow rounded-3xl p-8 mb-8 relative overflow-hidden">
        <h2 class="text-2xl font-bold text-white mb-4 flex items-center"><div class="stat-icon">👑</div>レベル</h2>
        <div class="flex items-center justify-between mb-4">
          <span id="levelValue">--</span>
          <div class="text-right">
            <div class="text-sm text-gray-400">MAX LEVEL</div>
            <div class="text-2xl font-bold text-gray-300">100</div>
          </div>
        </div>
        <div class="relative w-full h-6 rounded-full mb-4" style="background: rgba(255,255,255,0.1);">
          <div id="levelBar"></div>
        </div>
        <div id="nextLevelInfo" class="text-gray-300 font-medium">--</div>
      </div>

      <!-- グラフ -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="glassmorphism rounded-3xl p-8 card-hover">
          <h2 class="text-2xl font-bold text-white mb-6 flex items-center"><div class="stat-icon">📈</div>最新ステータス</h2>
          <canvas id="radarChart"></canvas>
          <div class="mt-6 text-center space-y-2">
            <div class="text-gray-300">平均スコア</div>
            <div class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">
              <span id="avgScore">--</span>
            </div>
            <div id="lastDate" class="text-sm text-gray-400">--</div>
          </div>
        </div>

        <div class="glassmorphism rounded-3xl p-8 card-hover">
          <h2 class="text-2xl font-bold text-white mb-6 flex items-center"><div class="stat-icon">📊</div>スコア推移</h2>
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>

    <div id="manageView" class="hidden">
      <div class="glassmorphism rounded-3xl p-8 card-hover">
        <h2 class="text-2xl font-bold text-white mb-6 flex items-center"><div class="stat-icon">🗂️</div>履歴管理</h2>
        <div id="historyList" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    // ここから下のJSは元のまま
    const db = new PouchDB('self_status');
    const radarCtx = document.getElementById('radarChart').getContext('2d');
    const lineCtx = document.getElementById('lineChart').getContext('2d');
    const avgScoreEl = document.getElementById('avgScore');
    const lastDateEl = document.getElementById('lastDate');
    const levelValueEl = document.getElementById('levelValue');
    const levelBarEl = document.getElementById('levelBar');
    const nextLevelInfoEl = document.getElementById('nextLevelInfo');
    const historyList = document.getElementById('historyList');

    const mainView = document.getElementById('mainView');
    const manageView = document.getElementById('manageView');
    const tabMain = document.getElementById('tabMain');
    const tabManage = document.getElementById('tabManage');

    tabMain.addEventListener('click',()=>{mainView.classList.remove('hidden');manageView.classList.add('hidden');tabMain.classList.add('tab-active');tabMain.classList.remove('tab-inactive');tabManage.classList.remove('tab-active');tabManage.classList.add('tab-inactive');});
    tabManage.addEventListener('click',()=>{manageView.classList.remove('hidden');mainView.classList.add('hidden');tabManage.classList.add('tab-active');tabManage.classList.remove('tab-inactive');tabMain.classList.remove('tab-active');tabMain.classList.add('tab-inactive');});

    let radarChart = new Chart(radarCtx,{type:'radar',data:{labels:['筋力','知力','資産力','継続力','生産性','精神力'],datasets:[{label:'最新ステータス',data:[0,0,0,0,0,0],backgroundColor:'rgba(251,191,36,0.2)',borderColor:'#fbbf24',borderWidth:2,pointBackgroundColor:'#f59e0b'}]},options:{responsive:true,scales:{r:{angleLines:{color:'#444'},grid:{color:'#333'},pointLabels:{color:'#fff'}}},plugins:{legend:{labels:{color:'#fff'}}}}});
    let lineChart = new Chart(lineCtx,{type:'line',data:{labels:[],datasets:[{label:'総合スコア',data:[],borderColor:'#fbbf24',backgroundColor:'rgba(251,191,36,0.2)',fill:true,tension:0.4}]},options:{responsive:true,scales:{x:{ticks:{color:'#fff'}},y:{ticks:{color:'#fff'}}}}});

    function updateCharts(latest){
      radarChart.data.datasets[0].data = [latest.training,latest.study,latest.asset,latest.continuity,latest.productivity,latest.mental];
      radarChart.update();
      db.allDocs({include_docs:true}).then(res=>{
        let labels=[],data=[];
        res.rows.forEach(r=>{labels.push(new Date(r.doc.date).toLocaleDateString());data.push(r.doc.total);});
        lineChart.data.labels=labels;lineChart.data.datasets[0].data=data;lineChart.update();
      });
    }

    function calcLevel(total){return Math.floor(Math.sqrt(total));}

    function updateLevel(total){
      let level = calcLevel(total);
      levelValueEl.textContent = level;
      let percent = Math.min(100,(total/100)*100);
      levelBarEl.style.width=percent+'%';
      nextLevelInfoEl.textContent = `次のレベルまであと ${Math.max(0,100-total)} ポイント`;
    }

    function refreshHistory(){
      db.allDocs({include_docs:true}).then(res=>{
        historyList.innerHTML='';
        res.rows.reverse().forEach(r=>{
          const div=document.createElement('div');
          div.className='bg-gray-800 text-white p-4 rounded-xl';
          div.textContent=`${new Date(r.doc.date).toLocaleString()} - 総合: ${r.doc.total}`;
          historyList.appendChild(div);
        });
      });
    }

    document.getElementById('statusForm').addEventListener('submit',e=>{
      e.preventDefault();
      let training=parseInt(document.getElementById('training').value)||0;
      let study=parseInt(document.getElementById('study').value)||0;
      let asset=parseInt(document.getElementById('asset').value)||0;
      let continuity=parseInt(document.getElementById('continuity').value)||0;
      let productivity=parseInt(document.getElementById('productivity').value)||0;
      let mental=parseInt(document.getElementById('mental').value)||0;
      let total = training+study+asset+continuity+productivity+mental;
      const doc={_id:new Date().toISOString(),date:new Date().toISOString(),training,study,asset,continuity,productivity,mental,total};
      db.put(doc).then(()=>{updateCharts(doc);updateLevel(total);refreshHistory();});
    });

    db.allDocs({include_docs:true}).then(res=>{
      if(res.rows.length>0){
        const latest=res.rows[res.rows.length-1].doc;
        updateCharts(latest);updateLevel(latest.total);refreshHistory();
      }
    });
  </script>
</body>
</html>
