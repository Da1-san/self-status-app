<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>セルフステータス管理</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
  <style>
    body{font-family:sans-serif;margin:20px;}
    form div{margin-bottom:10px;}
    canvas{max-width:500px;}
  </style>
</head>
<body>
  <h1>セルフステータス管理</h1>
  <form id="statusForm">
    <div>筋力: <input type="number" id="training" min="0" max="100" required></div>
    <div>知力（学習時間/時間）: <input type="number" id="study" min="0"></div>
    <div>資産力（万円）: <input type="number" id="asset" min="0"></div>
    <div>継続力: <input type="number" id="continuity" min="0" max="100" required></div>
    <div>生産性（スクリーンタイム/時間）: <input type="number" id="productivity" min="0"></div>
    <div>精神力: <input type="number" id="mental" min="0" max="100" required></div>
    <button type="submit">保存</button>
  </form>

  <h2>レーダーチャート</h2>
  <canvas id="radarChart"></canvas>

  <h2>棒グラフ</h2>
  <canvas id="barChart"></canvas>

  <h2>総合スコア</h2>
  <div id="level"></div>

  <h2>履歴</h2>
  <ul id="historyList"></ul>

  <script>
    const db=new PouchDB('statusdb');
    let radarChart,barChart;

    function convertStudy(hours){
      return Math.min(100, Math.floor(hours/10));
    }
    function convertAsset(millionYen){
      return Math.min(100, Math.floor(millionYen/100));
    }
    function convertProductivity(screenTime){
      return Math.max(0, 100 - (screenTime*10));
    }

    function updateCharts(doc){
      let ctxRadar=document.getElementById('radarChart').getContext('2d');
      if(radarChart){radarChart.destroy();}
      radarChart=new Chart(ctxRadar,{
        type:'radar',
        data:{
          labels:['筋力','知力','資産力','継続力','生産性','精神力'],
          datasets:[{
            label:'ステータス',
            data:[
              doc.training,
              doc.study,
              doc.asset,
              doc.continuity,
              doc.productivity,
              doc.mental
            ],
            fill:true,
            backgroundColor:'rgba(54,162,235,0.2)',
            borderColor:'rgb(54,162,235)'
          }]
        },
        options:{scales:{r:{min:0,max:100}}}
      });

      let ctxBar=document.getElementById('barChart').getContext('2d');
      if(barChart){barChart.destroy();}
      barChart=new Chart(ctxBar,{
        type:'bar',
        data:{
          labels:['筋力','知力','資産力','継続力','生産性','精神力'],
          datasets:[{
            label:'ステータス',
            data:[
              doc.training,
              doc.study,
              doc.asset,
              doc.continuity,
              doc.productivity,
              doc.mental
            ],
            backgroundColor:'rgba(255,99,132,0.5)'
          }]
        },
        options:{scales:{y:{min:0,max:100}}}
      });
    }

    function updateLevel(total){
      document.getElementById('level').textContent = `総合スコア: ${total} / 500`;
    }

    function refreshHistory(){
      db.allDocs({include_docs:true,descending:true}).then(res=>{
        const list=document.getElementById('historyList');
        list.innerHTML='';
        res.rows.forEach(r=>{
          let d=r.doc;
          let li=document.createElement('li');
          li.textContent=`${d.date}: Total=${d.total}/500 | 筋力=${d.training}, 知力=${d.study}(raw:${d.raw.study}), 資産力=${d.asset}(raw:${d.raw.asset}), 継続力=${d.continuity}, 生産性=${d.productivity}(raw:${d.raw.productivity}), 精神力=${d.mental}`;
          list.appendChild(li);
        });
      });
    }

    document.getElementById('statusForm').addEventListener('submit',e=>{
      e.preventDefault();
      let training=parseInt(document.getElementById('training').value)||0;
      let studyInput=parseInt(document.getElementById('study').value)||0;
      let assetInput=parseInt(document.getElementById('asset').value)||0;
      let continuity=parseInt(document.getElementById('continuity').value)||0;
      let productivityInput=parseInt(document.getElementById('productivity').value)||0;
      let mental=parseInt(document.getElementById('mental').value)||0;

      // 換算後スコア
      let study=convertStudy(studyInput);
      let asset=convertAsset(assetInput);
      let productivity=convertProductivity(productivityInput);

      // 合計は「生産性」を除外 → 最大500点
      let total = training + study + asset + continuity + mental;

      const doc={
        _id:new Date().toISOString(),
        date:new Date().toLocaleString(),
        training,study,asset,continuity,productivity,mental,
        total,
        raw:{study:studyInput, asset:assetInput, productivity:productivityInput}
      };
      db.put(doc).then(()=>{
        updateCharts(doc);
        updateLevel(total);
        refreshHistory();
        // 入力値を保存
        localStorage.setItem('lastInputs', JSON.stringify({
          training, studyInput, assetInput, continuity, productivityInput, mental
        }));
      });
    });

    window.addEventListener('load',()=>{
      refreshHistory();
      db.allDocs({include_docs:true}).then(res=>{
        if(res.rows.length>0){
          let latest=res.rows[res.rows.length-1].doc;
          updateCharts(latest);
          updateLevel(latest.total);
        }
      });
      const saved = localStorage.getItem('lastInputs');
      if(saved){
        const d = JSON.parse(saved);
        document.getElementById('training').value = d.training;
        document.getElementById('study').value = d.studyInput;
        document.getElementById('asset').value = d.assetInput;
        document.getElementById('continuity').value = d.continuity;
        document.getElementById('productivity').value = d.productivityInput;
        document.getElementById('mental').value = d.mental;
      }
    });
  </script>
</body>
</html>
