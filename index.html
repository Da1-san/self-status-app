<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>習慣ダッシュボード</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-6">

  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">習慣ダッシュボード</h1>

    <!-- 入力フォーム -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block font-semibold">日付</label>
        <input type="date" id="date" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block font-semibold">筋力</label>
        <input type="number" id="training" min="0" max="10" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block font-semibold">知力</label>
        <input type="number" id="study" min="0" max="10" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block font-semibold">🪙 資産力</label>
        <input type="number" id="asset" min="0" max="10" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block font-semibold">継続力</label>
        <input type="number" id="continuity" min="0" max="10" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block font-semibold">生産性</label>
        <input type="number" id="productivity" min="0" max="10" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block font-semibold">精神力</label>
        <input type="number" id="mental" min="0" max="10" class="w-full border p-2 rounded">
      </div>
    </div>

    <button id="addBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mb-4">追加</button>

    <!-- 合計表示 -->
    <div class="mb-4">
      <h2 class="font-semibold">合計スコア: <span id="totalScore">0</span></h2>
    </div>

    <!-- レーダーチャート -->
    <canvas id="radarChart" class="mb-6"></canvas>

    <!-- 履歴テーブル -->
    <table class="w-full border-collapse border border-gray-300">
      <thead>
        <tr class="bg-gray-200">
          <th class="border p-2">日付</th>
          <th class="border p-2">筋力</th>
          <th class="border p-2">知力</th>
          <th class="border p-2">🪙資産力</th>
          <th class="border p-2">継続力</th>
          <th class="border p-2">生産性</th>
          <th class="border p-2">精神力</th>
          <th class="border p-2">操作</th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>

  <script>
    let entries = [];

    const ctx = document.getElementById('radarChart').getContext('2d');
    const radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ["筋力","知力","🪙資産力","継続力","生産性","精神力"],
        datasets: [{
          label: '最新スコア',
          data: [0,0,0,0,0,0],
          backgroundColor: 'rgba(59,130,246,0.2)',
          borderColor: 'rgba(59,130,246,1)',
          borderWidth: 2
        }]
      },
      options: {
        scales: {
          r: {
            suggestedMin: 0,
            suggestedMax: 10
          }
        }
      }
    });

    function updateChart() {
      if (entries.length === 0) return;
      const latest = entries[entries.length - 1];
      radarChart.data.datasets[0].data = [
        latest.training,
        latest.study,
        latest.asset,
        latest.continuity,
        latest.productivity,
        latest.mental
      ];
      radarChart.update();
    }

    function updateHistory() {
      const tbody = document.getElementById('history');
      tbody.innerHTML = '';
      entries.forEach((e, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="border p-2">${e.date}</td>
          <td class="border p-2">${e.training}</td>
          <td class="border p-2">${e.study}</td>
          <td class="border p-2">${e.asset}</td>
          <td class="border p-2">${e.continuity}</td>
          <td class="border p-2">${e.productivity}</td>
          <td class="border p-2">${e.mental}</td>
          <td class="border p-2">
            <button onclick="deleteEntry(${index})" class="text-red-500 hover:underline">削除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateTotalScore() {
      if (entries.length === 0) {
        document.getElementById('totalScore').textContent = 0;
        return;
      }
      const latest = entries[entries.length - 1];
      const total = Number(latest.training)+Number(latest.study)+Number(latest.asset)+Number(latest.continuity)+Number(latest.productivity)+Number(latest.mental);
      document.getElementById('totalScore').textContent = total;
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const entry = {
        date: document.getElementById('date').value,
        training: document.getElementById('training').value || 0,
        study: document.getElementById('study').value || 0,
        asset: document.getElementById('asset').value || 0,
        continuity: document.getElementById('continuity').value || 0,
        productivity: document.getElementById('productivity').value || 0,
        mental: document.getElementById('mental').value || 0
      };
      entries.push(entry);
      updateChart();
      updateHistory();
      updateTotalScore();
    });

    function deleteEntry(index) {
      entries.splice(index, 1);
      updateChart();
      updateHistory();
      updateTotalScore();
    }
  </script>
</body>
</html>
